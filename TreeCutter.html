<!doctype html>
<html lang="en">
    <head>
        <title>EvilCorpoSim</title>
        <link rel="stylesheet" href="TreeCutter.CSS" />
        <script src="treeCutter.js"></script>
    </head>
    <body>
        <div id="headder">
            <h1>EvilCorpoSim</h1>
            <h3 id="counter">count</h3>
        </div>
        <button
            type="button"
            class="ib"
            onclick="cutTree()"
            draggable="false"
            id="treeImage"
        >
            <img
                src="assets/tree.png"
                alt="sillyBilly"
                height="200"
                width="100"
                id="tree"
            />
        </button>
        <div id="upgrades">
            <ul>
                <li>upgrade1</li>
                <li>upgrade2</li>
                <li>upgrade3</li>
                <li>upgrade4</li>
                <li>upgrade5</li>
            </ul>
            <button type="button" onclick="buyUpgrade(0)">lumberJack</button>
            <button type="button" onclick="buyUpgrade(1)">chainsaw-man</button>
            <button type="button" onclick="buyUpgrade(2)">treeChomper</button>
            <button type="button" onclick="buyUpgrade(3)">cutternator</button>
            <button type="button">Button5t</button>
            <div id="container1"></div>
            <div id="container2"></div>
            <div id="container3"></div>
            <div id="container4"></div>
            <div id="container5"></div>
            <p id="cost1">cost</p>
            <p id="cost2">cost</p>
            <p id="cost3">cost</p>
            <p id="cost4">cost</p>
            <p id="cost5">cost</p>
        </div>
        <div id="honePage">
            <h2>return</h2>
            <a href="index.html">main page</a>
        </div>
    </body>
</html>
